# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
        # checkout the repo
        - name: 'Checkout GitHub Action'
          uses: actions/checkout@main

        - name: Debug Connection
          run: |
            curl -v https://registry.dominicmaas.co.nz/v2/

        # Login to the NESO registry
        - name: Docker Login
          uses: docker/login-action@v4.1.0
          with:
            registry: https://registry.dominicmaas.co.nz
            username: sol
            password: ${{ secrets.SOL_PASSWORD }}

        - name: 'Setup Docker BuildX'
          uses: docker/setup-buildx-action@v4

        - name: 'Build and Push Image'
          uses: docker/build-push-action@v7
          with:
            context: src/Website/
            push: true
            tags: registry.dominicmaas.co.nz/personal-website:latest
            # The Dockerfile publishes for linux-x64 specifically, so pin the
            # platform rather than letting buildx infer it.
            platforms: linux/amd64
            # Skip the provenance attestation - it pushes an extra manifest and
            # index for no benefit here.
            provenance: false
            cache-from: type=gha
            cache-to: type=gha,mode=max
